# Production compose — uses published images, no build step required.
# Usage: docker compose -f deploy/docker-compose.yml up -d

services:
  orchestrator:
    image: ghcr.io/georgebuilds/kalos-orchestrator:latest
    pull_policy: always
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - kalos-data:/app/packages/orchestrator/data
      - ./kalos.pem:/app/kalos.pem:ro
    env_file: .env
    environment:
      - DATABASE_URL=/app/packages/orchestrator/data/kalos.db
      - DOCKER_SOCKET=/var/run/docker.sock
      - AGENT_IMAGE=ghcr.io/georgebuilds/kalos-agent:latest
      - PORT=${PORT:-3000}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-2000}
      - MAX_CONCURRENT_TASKS=${MAX_CONCURRENT_TASKS:-2}
      - TASK_TIMEOUT_MS=${TASK_TIMEOUT_MS:-600000}
      - GITHUB_APP_PRIVATE_KEY_PATH=/app/kalos.pem
    restart: unless-stopped

volumes:
  kalos-data:
